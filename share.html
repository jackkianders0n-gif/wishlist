<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Christmas list</title>
<meta name="theme-color" content="#1F5A43">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F4F5F1; --ink: #1B2420; --muted: #5B6660; --line: #E2E5DF; --line2: #C9CFC8;
    --pine: #1F5A43; --pine-tint: #D4E6DB; --accent: #B8324A; --gift: #1D4E89; --gift-tint: #E3ECF7;
    --display: 'Bricolage Grotesque', Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  :focus-visible { outline: 3px solid #6AA88A; outline-offset: 2px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px calc(48px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
  .hero { background: var(--pine); color: #fff; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 6px; }
  .hero .logo { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.14); display: grid; place-items: center; margin-bottom: 6px; }
  .hero h1 { margin: 0; font-family: var(--display); font-size: 28px; letter-spacing: -0.01em; line-height: 1.15; }
  .hero p { margin: 0; color: var(--pine-tint); font-size: 15px; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .item.mine { border: 2px solid var(--gift); }
  .item h2 { margin: 0; font-family: var(--display); font-size: 21px; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .item h2 .qty { font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; color: var(--muted); }
  .hint { margin: 0; font-size: 14px; color: var(--muted); }
  .opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 14px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: inherit; }
  .opt:hover { border-color: var(--line2); }
  .pic { flex: none; width: 76px; height: 76px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pic img { display: block; width: auto; height: auto; max-width: 70px; max-height: 70px; object-fit: contain; }
  .opt-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .opt-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .opt-store { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .top { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .price { flex: none; font-family: var(--display); font-size: 18px; font-weight: 700; }
  .nolink { padding: 12px; border: 1.5px dashed var(--line2); border-radius: 14px; font-size: 14px; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 12px; min-height: 48px; padding: 0 18px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-gift { background: var(--gift); color: #fff; flex: 1 1 auto; }
  .btn-ghost { background: transparent; color: var(--muted); text-decoration: underline; min-height: 44px; padding: 0 8px; font-size: 15px; font-weight: 500; }
  .mine-note { display: flex; align-items: center; gap: 8px; color: var(--gift); font-weight: 700; background: var(--gift-tint); border-radius: 12px; padding: 12px 14px; flex: 1 1 auto; }
  .state { text-align: center; padding: 48px 20px; background: #fff; border: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .state h2 { margin: 0; font-family: var(--display); font-size: 22px; }
  .state p { margin: 0; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border-radius: 999px; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="state"><span class="spinner" aria-hidden="true"></span><p>Loading the list…</p></div>
</main>
<div id="toast" class="toast" role="status" hidden></div>

<script>
// Same project and public key as the app. This page can only call the three wl_share_* functions.
const SUPABASE_URL = "https://wvedhcuebfdfkhfvphlb.supabase.co";
const SUPABASE_KEY = "sb_publishable_bkeGnvruQEz3MsVDZiJ03g_bhXXDjgC";

// The secret is after the # so it never reaches GitHub's servers or other sites.
const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const app = document.getElementById("app");
let data = null;
const busy = new Set();

const ICON = {
  gift: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
  check: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  ext: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  image: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A857F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
};

// Build elements safely: product names come from shop pages, so never use innerHTML for them.
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v; // only ever our own icon strings
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
const gbp = (n) => "£" + Number(n).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const joinNames = (a) => (a.length <= 1 ? a.join("") : a.slice(0, -1).join(", ") + " & " + a[a.length - 1]);

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3500);
}

async function rpc(fn, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function state(title, text) {
  app.replaceChildren(el("div", { class: "state" }, el("h2", {}, title), text ? el("p", {}, text) : null));
}

async function load(quiet) {
  if (!token) { state("This link isn’t complete", "Ask for the link again and open it in full."); return; }
  try {
    data = await rpc("wl_share_view", { p_token: token });
  } catch {
    if (!quiet) state("Couldn’t load the list", "Check your connection and try again.");
    return;
  }
  if (!data) { state("This link has been turned off", "Ask for a new one if you still need it."); return; }
  render();
}

function render() {
  const owners = joinNames(data.owners || []);
  const listName = data.list === "xmas" ? "Christmas list" : "list for the flat";
  document.title = owners ? `${owners}’s ${listName}` : listName;
  const items = data.items || [];
  const mineCount = items.filter((i) => i.mine).length;

  const hero = el("section", { class: "hero" },
    el("span", { class: "logo", html: ICON.gift.replace('stroke="currentColor"', 'stroke="#fff"') }),
    el("h1", {}, owners ? `${owners}’s ${listName}` : `The ${listName}`),
    el("p", {}, `Hi ${data.for_name}! Tap a product to see it in the shop. When you decide to get something, tap “I’m getting this” so nobody else buys the same thing.`),
  );

  const kids = [hero];
  if (!items.length) {
    kids.push(el("div", { class: "state" }, el("h2", {}, "All sorted!"), el("p", {}, "Everything on the list has been bought or someone’s getting it.")));
  }
  for (const it of items) kids.push(itemCard(it));
  if (mineCount) kids.push(el("p", { class: "foot" }, `You’re getting ${mineCount} thing${mineCount === 1 ? "" : "s"}. ${owners || "They"} can see you’re getting ${mineCount === 1 ? "it" : "them"}.`));
  app.replaceChildren(...kids);
}

function itemCard(it) {
  const opts = it.options || [];
  const isBusy = busy.has(it.id);
  const optsList = opts.length
    ? el("ul", { class: "opts" }, opts.map((o) => {
        const url = safeUrl(o.url);
        const img = safeUrl(o.image);
        const pic = el("span", { class: "pic" });
        if (img) {
          const i = el("img", { src: img, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
          i.addEventListener("error", () => { pic.innerHTML = ICON.image; });
          pic.append(i);
        } else pic.innerHTML = ICON.image;
        const inner = [
          pic,
          el("span", { class: "opt-main" },
            o.top && opts.length > 1 ? el("span", { class: "top" }, "Their top pick") : null,
            el("span", { class: "opt-name" }, o.title || o.store || "Product"),
            el("span", { class: "opt-store" }, o.store || "", el("span", { html: ICON.ext })),
          ),
          o.price != null ? el("span", { class: "price" }, gbp(o.price)) : null,
        ];
        return el("li", {}, url ? el("a", { class: "opt", href: url, target: "_blank", rel: "noopener noreferrer" }, inner) : el("div", { class: "opt" }, inner));
      }))
    : el("div", { class: "nolink" }, "No particular one picked — anything like this would be lovely.");

  const action = it.mine
    ? el("div", { class: "row" },
        el("span", { class: "mine-note", html: ICON.check + "<span>You’re getting this</span>" }),
        el("button", { type: "button", class: "btn btn-ghost", disabled: isBusy, onclick: () => unclaim(it) }, "Undo"))
    : el("button", { type: "button", class: "btn btn-gift", disabled: isBusy, onclick: () => claim(it), html: (isBusy ? '<span class="spinner" aria-hidden="true"></span>' : ICON.gift) + "<span>I’m getting this</span>" });

  return el("article", { class: "item" + (it.mine ? " mine" : ""), "aria-label": it.title },
    el("h2", {}, it.title, it.qty > 1 ? el("span", { class: "qty" }, `× ${it.qty}`) : null),
    opts.length > 1 ? el("p", { class: "hint" }, `${opts.length} options — any of these would be great.`) : null,
    optsList,
    action,
  );
}

async function claim(it) {
  busy.add(it.id); render();
  try {
    const ok = await rpc("wl_share_claim", { p_token: token, p_item: it.id });
    toast(ok ? "Thank you! It’s marked as yours." : "Someone else has just got this one.");
  } catch { toast("Couldn’t save that. Check your connection and try again."); }
  busy.delete(it.id); await load(true);
}
async function unclaim(it) {
  busy.add(it.id); render();
  try {
    const ok = await rpc("wl_share_unclaim", { p_token: token, p_item: it.id });
    toast(ok ? "Undone — it’s back on the list." : "That can’t be undone now — it may already be marked as bought.");
  } catch { toast("Couldn’t save that. Check your connection and try again."); }
  busy.delete(it.id); await load(true);
}

load();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && data) load(true); });
</script>
</body>
</html>
